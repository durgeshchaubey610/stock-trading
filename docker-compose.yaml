version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: stock_trading_db
    restart: always
    environment:
      MYSQL_DATABASE: trading_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: stock_trading_backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db

  frontend:
    build: 
      context: ./frontend
    container_name: stock_trading_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
