version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: stock_trading_db
    restart: always
    environment:
      MYSQL_DATABASE: stock_ai
      MYSQL_USER: stock_user
      MYSQL_PASSWORD: stock_password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - stock_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_trading_backend
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=stock_user
      - DB_PASS=stock_password
      - DB_NAME=stock_ai
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - stock_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/
    container_name: stock_trading_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - stock_network

volumes:
  mysql_data:

networks:
  stock_network:
    driver: bridge
